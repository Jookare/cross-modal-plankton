# Example experiment.yaml

data:
  train: UTO # or UTO
  test: LAB # or SEA
  image_size: 224

models:
  folder: multi
  checkpoints: [
    efficientnet_b0_cnn_clip_512_UTO,
  ]
  folds: 5

embedding:
  batch_size: 512
  num_workers: 8
  save_path: ./results/embeddings/efficientnet_uto.pkl

benchmark:
  n_per_class: [1,2,4,8,16]
  k_values: [3]
  repeats: 5
  min_samples: 0
  seed: 0
  save_path: ./results/benchmarks/efficientnet_uto.pkl
