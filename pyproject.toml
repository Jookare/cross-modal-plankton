[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-modal-plankton"
version = "0.1.0"
dependencies = [
    "pandas>=2.2.3",
    "scikit-learn>=1.5.2",
    "timm>=1.0.24",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "pyyaml>=6.0.2",
    "lightning>=2.5.1",
    "tensorboard>=2.18.0",
    "lightly>=1.5.17",
    "notebook>=7.3.3"
]

[tool.setuptools]
packages = ["src"]